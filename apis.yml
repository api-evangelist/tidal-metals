name: Tidal Metals
description: >-
  Tidal Metals is a deep-tech materials company that extracts decarbonized
  magnesium directly from seawater and desalination brine using only electricity
  from renewable sources, without mining, chemical additives, or brine waste. The
  company's patented process concentrates and extracts magnesium salt to address a
  critical supply-chain vulnerability: the United States currently produces no
  primary magnesium while China controls roughly 91% of global supply. Founded by
  Ph.D. physicists and engineers with backgrounds in nuclear engineering and
  plasma physics from MIT, Princeton, and Wisconsin-Madison, and backed by DCVC,
  Tidal Metals aims for carbon-neutral, domestically scalable magnesium
  production. Surfaced as a portfolio company of DCVC and added to the API
  Evangelist network; the company publishes no public API, developer portal, or
  machine-readable surface at this time.
